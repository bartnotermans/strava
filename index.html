<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bart's Performance Dashboard</title>
    <style>
        :root {
            --strava-orange: #FC4C02;
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1D1D1F;
            --text-muted: #6E6E73;
            --border-color: #E5E5E7;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 10px;
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }

        .header { display: flex; align-items: center; margin-bottom: 20px; padding: 10px; }
        .strava-logo { width: 32px; height: 32px; fill: var(--strava-orange); margin-right: 12px; }
        .title-group h1 { font-size: 1.3rem; font-weight: 900; margin: 0; }
        .title-group h1 span { color: var(--strava-orange); }

        /* Filters: Compact op mobiel, Row op desktop */
        .filters { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            background: #f9f9f9; 
            padding: 15px; 
            border-radius: 18px; 
            margin-bottom: 20px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        input { 
            padding: 12px; 
            border: 1.5px solid #e2e2e2; 
            border-radius: 12px; 
            font-size: 16px; 
            background: white;
            appearance: none;
        }

        /* Stats Grid: 1 kolom op mobiel, 2 op tablet, 3 op desktop */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-info .label { font-size: 1rem; font-weight: 800; }
        .stat-info .count { font-size: 0.7rem; color: var(--text-muted); }
        .stat-values { text-align: right; }
        .stat-values .fastest { color: var(--strava-orange); font-weight: 800; font-size: 1.1rem; display: block; }
        .stat-values .avg { font-size: 0.75rem; color: var(--text-muted); }

        h2 { font-size: 1rem; font-weight: 800; margin: 25px 0 10px 5px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Logboek aanpassingen */
        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th { text-align: left; padding: 12px 10px; font-size: 0.65rem; color: var(--text-muted); border-bottom: 2px solid var(--border-color); }
        td { padding: 12px 10px; border-bottom: 1px solid #f5f5f5; font-size: 0.85rem; }

        .pace-cell { font-weight: 700; text-align: right; }
        .run-name { font-weight: 700; display: block; margin-bottom: 2px; }
        .date-cell { white-space: nowrap; color: var(--text-muted); font-size: 0.75rem; }

        @media (min-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .filters { grid-template-columns: repeat(3, 1fr); }
            body { padding: 30px; }
            .container { padding: 30px; }
        }

        @media (min-width: 900px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <svg class="strava-logo" viewBox="0 0 24 24"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l7 13.828h-4.172"/></svg>
        <div class="title-group">
            <h1>Bart's <span>Performance</span></h1>
        </div>
    </div>

    <div class="filters">
        <div class="filter-group"><label>Vanaf</label><input type="date" id="dateFrom"></div>
        <div class="filter-group"><label>Tot</label><input type="date" id="dateTo"></div>
        <div class="filter-group"><label>Zoek</label><input type="text" id="nameFilter" placeholder="Filter op naam..."></div>
    </div>

    <h2>Records per afstand</h2>
    <div id="statsGrid" class="stats-grid"></div>

    <h2>Activiteiten</h2>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 25%">Datum</th>
                    <th style="width: 50%">Training</th>
                    <th style="width: 25%; text-align: right;">Tempo</th>
                </tr>
            </thead>
            <tbody id="detailsBody"></tbody>
        </table>
    </div>
</div>

<script>
    let allRuns = [];

    function formatPace(secsPerKm) {
        if (!secsPerKm || isNaN(secsPerKm) || !isFinite(secsPerKm)) return "--:--";
        const mins = Math.floor(secsPerKm / 60);
        const secs = Math.round(secsPerKm % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}<small> m/km</small>`;
    }

    function updateDashboard() {
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        const nameFilter = document.getElementById('nameFilter').value.toLowerCase();

        const filtered = allRuns.filter(r => 
            (!from || r.datum >= from) && 
            (!to || r.datum <= to) && 
            (!nameFilter || r.naam.toLowerCase().includes(nameFilter))
        );

        const targets = [
            { label: "400m", dist: 400, margin: 100 },
            { label: "1 km", dist: 1000, margin: 150 },
            { label: "5 km", dist: 5000, margin: 400 },
            { label: "10 km", dist: 10000, margin: 600 },
            { label: "15 km", dist: 15000, margin: 800 },
            { label: "Half Marathon", dist: 21097, margin: 1000 },
            { label: "Marathon", dist: 42195, margin: 1500 }
        ];

        const grid = document.getElementById('statsGrid');
        grid.innerHTML = '';

        targets.forEach(t => {
            let paces = [];
            filtered.forEach(run => {
                // Check in Laps
                if (run.laps) {
                    run.laps.forEach(lap => {
                        if (Math.abs(lap.afstand - t.dist) < t.margin && lap.tijd > 0) {
                            paces.push(lap.tijd / (lap.afstand / 1000));
                        }
                    });
                }
                // Check in Hele Rit
                if (Math.abs(run.afstand_m - t.dist) < t.margin && run.tijd_sec > 0) {
                    paces.push(run.tijd_sec / (run.afstand_m / 1000));
                }
            });

            const fastest = paces.length > 0 ? Math.min(...paces) : null;
            const avg = paces.length > 0 ? paces.reduce((a,b) => a+b, 0) / paces.length : null;

            grid.innerHTML += `
                <div class="stat-card">
                    <div class="stat-info">
                        <div class="label">${t.label}</div>
                        <div class="count">${paces.length}x</div>
                    </div>
                    <div class="stat-values">
                        <span class="fastest">${fastest ? formatPace(fastest) : '--:--'}</span>
                        <span class="avg">gem: ${avg ? formatPace(avg).replace('<small> m/km</small>', '') : '-'}</span>
                    </div>
                </div>
            `;
        });

        const detailsBody = document.getElementById('detailsBody');
        detailsBody.innerHTML = '';
        
        [...filtered].sort((a,b) => b.datum.localeCompare(a.datum)).slice(0, 100).forEach(run => {
            const pace = run.tijd_sec / (run.afstand_m / 1000);
            // Datum terug naar dd-mm-yyyy
            const d = run.datum.split('-');
            const displayDate = `${d[2]}-${d[1]}-${d[0]}`;

            detailsBody.innerHTML += `
                <tr>
                    <td class="date-cell">${displayDate}</td>
                    <td>
                        <span class="run-name">${run.naam}</span>
                        <span style="font-size:0.7rem; color:var(--text-muted)">${(run.afstand_m/1000).toFixed(2)} km</span>
                    </td>
                    <td class="pace-cell">${formatPace(pace)}</td>
                </tr>
            `;
        });
    }

    fetch('stats.json')
        .then(r => r.json())
        .then(data => {
            allRuns = data;
            // Defaults instellen
            document.getElementById('dateFrom').value = "2025-01-01";
            document.getElementById('dateTo').value = new Date().toISOString().split('T')[0];
            
            // Event listeners voor DIRECTE actie
            document.getElementById('dateFrom').addEventListener('change', updateDashboard);
            document.getElementById('dateTo').addEventListener('change', updateDashboard);
            document.getElementById('nameFilter').addEventListener('input', updateDashboard);
            
            updateDashboard();
        });
</script>
</body>
</html>
